# Installs dependencies, lints with flake8 and runs the test suite.
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip

    # MediaPipe dlopens the system GL stack when it builds a HandLandmarker,
    # and a stock ubuntu runner has neither libEGL nor libGL. Without these the
    # end-to-end pipeline test raises
    #     OSError: libEGL.so.1: cannot open shared object file
    # The test skips itself when they are missing, so leaving this step out
    # would turn a real failure into silently reduced coverage rather than a
    # red build. Installing them is what makes that test actually run here.
    - name: Install system libraries MediaPipe and OpenCV need
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libegl1 libgl1 libglib2.0-0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # Stop the build on syntax errors or undefined names.
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Everything else is advisory. The GitHub editor is 127 chars wide.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        pytest -q

    # Proves the figures in the README can still be rebuilt from the code they
    # document. If a rename breaks the generator, this catches it before the
    # images silently go stale.
    - name: Regenerate the README figures
      run: |
        python docs/make_examples.py
